# Development overrides — applied automatically by `docker compose up`.
services:
  # Owns the network namespace php and worker run in, so the code they execute — the mounted
  # repository, which the claude service can edit — gets the same egress firewall as claude:
  # internet open, LAN and Docker host closed. Starts as root only to set the rules (dev-firewall,
  # docs/internal/CLAUDE-CONTAINER.md), then idles as DEV_UID without capabilities. php and
  # worker themselves stay unprivileged, so `docker compose exec php …` keeps running as DEV_UID.
  # Ports, the `php` hostname and the host gateway entry live here, on the namespace owner.
  netguard:
    image: ${IMAGES_PREFIX:-}odinshield-php-dev
    build:
      context: .
      target: frankenphp_dev
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION:-1.13.4-php8.5}
    restart: unless-stopped
    user: "0:0"
    cap_add: [NET_ADMIN, NET_RAW]
    init: true
    entrypoint: ["dev-firewall"]
    command: ["sleep", "infinity"]
    environment:
      FIREWALL_RUN_AS: "${DEV_UID:-1000}:${DEV_GID:-1000}"
      # Xdebug connects back to the IDE on the host (20-app.dev.ini: host.docker.internal:9003).
      FIREWALL_ALLOW_GATEWAY_PORTS: "9003"
      FIREWALL_READY_FILE: /tmp/firewall-ready
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/firewall-ready"]
      interval: 2s
      retries: 15
    # Only so dev-firewall hands dev_log to DEV_UID (as root) before php and worker start.
    volumes:
      - dev_log:/app/var/log
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        # SERVER_NAME answers on php:80 — the name keeps resolving to the shared namespace.
        aliases: [php]

  php:
    image: ${IMAGES_PREFIX:-}odinshield-php-dev
    build:
      context: .
      target: frankenphp_dev
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION:-1.13.4-php8.5}
    # Runs as the host user so files written into the repo are not root-owned (the claude
    # service shares the mount). Binding 80/443 works unprivileged: Docker sets
    # ip_unprivileged_port_start=0 and the frankenphp binary carries cap_net_bind_service.
    # Existing root-owned files and caddy volumes: `make fix-owner` once.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    # Network (and with it ports and the firewall) comes from netguard. NET_ADMIN is not in this
    # container's capability set, so not even root in here could change netguard's rules.
    network_mode: service:netguard
    security_opt: [no-new-privileges:true]
    ports: !reset []
    depends_on:
      netguard:
        condition: service_healthy
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - /app/var
      # Shared with worker and claude: dev.log is readable from the claude container, which
      # has no Docker socket. Owned by DEV_UID via netguard's dev-firewall.
      - dev_log:/app/var/log
      # #100: `symfony lsp:check` runs on the host and writes its PHP bridge to var/symfony-lsp/,
      # then executes it inside this container. The anonymous /app/var volume above hides the
      # host's var/ — this nested bind mount makes exactly that subdirectory visible again.
      - ./var/symfony-lsp:/app/var/symfony-lsp
    env_file:
      - path: environment/.env
        required: true
      - path: environment/.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # The image's HOME is /root, which the host user cannot write (Composer cache).
      HOME: /tmp
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Single worker in dev: file-watch + xdebug breakpoints stay deterministic.
      # \n is expanded by YAML → two directives inside the worker block.
      FRANKENPHP_WORKER_CONFIG: "num 1\nwatch"
    tty: true

  worker:
    image: ${IMAGES_PREFIX:-}odinshield-php-dev
    build:
      context: .
      target: frankenphp_dev
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION:-1.13.4-php8.5}
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    network_mode: service:netguard
    security_opt: [no-new-privileges:true]
    volumes:
      - ./:/app
      - /app/var
      - dev_log:/app/var/log
    env_file:
      - path: environment/.env
        required: true
      - path: environment/.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HOME: /tmp

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    # Pinned like every other image in the stack — an untagged reference resolves to :latest
    # and silently drifts across majors between `up -d` runs. Dev-only mail catcher.
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.30.5}
    ports:
      - "1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  # Claude Code next to the dev stack (docs/internal/CLAUDE-CONTAINER.md). Start with
  # `make claude`; the profile keeps `make start` from starting it. No Docker socket, no ports, no
  # credentials but its own login volume. Same egress firewall as netguard (dev-firewall, starts as
  # root, hence NET_ADMIN/NET_RAW) plus git01:443, then runs as `claude` (DEV_UID) without
  # capabilities.
  claude:
    profiles: [claude]
    image: ${IMAGES_PREFIX:-}odinshield-claude
    build:
      context: .
      target: frankenphp_claude
      args:
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION:-1.13.4-php8.5}
        NODE_VERSION: ${NODE_VERSION:-24.22.1}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.308}
        BIOME_VERSION: ${BIOME_VERSION:-2.2.0}
        MARKDOWNLINT_VERSION: ${MARKDOWNLINT_VERSION:-0.23.3}
        DEV_BROWSER_VERSION: ${DEV_BROWSER_VERSION:-0.2.9}
        SHFMT_VERSION: ${SHFMT_VERSION:-3.14.1}
        SHELLCHECK_VERSION: ${SHELLCHECK_VERSION:-0.11.0}
        HADOLINT_VERSION: ${HADOLINT_VERSION:-2.15.1}
        GITLEAKS_VERSION: ${GITLEAKS_VERSION:-8.30.1}
        SYMFONY_CLI_VERSION: ${SYMFONY_CLI_VERSION:-5.22.0}
        REUSE_VERSION: ${REUSE_VERSION:-6.2.0}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    user: "0:0"
    cap_add: [NET_ADMIN, NET_RAW]
    working_dir: /app
    volumes:
      - ./:/app
      # Executed by the host (git reads config on every command, hooks run on push): read-only
      # here, so the container can commit, branch and tag but not plant core.fsmonitor or a hook.
      # The host guard and its approval hash live in hooks/ for the same reason.
      - ./.git/config:/app/.git/config:ro
      - ./.git/hooks:/app/.git/hooks:ro
      # Loaded by Claude Code on the host, but gitignored — the host guard could never approve a
      # change to it, so the container simply cannot make one. `make claude` creates it if missing
      # (a missing source would otherwise be refused, not created as a directory).
      - type: bind
        source: ./.claude/settings.local.json
        target: /app/.claude/settings.local.json
        read_only: true
        bind:
          create_host_path: false
      # Own var/ like php: the ci stamp on the host's var/ stays out of reach.
      - /app/var
      # php's and worker's logs (dev.log) — debugging without docker compose exec.
      - dev_log:/app/var/log
      - claude_config:/home/claude/.claude
      # The host's extra CAs (public certificates only) — git01 is signed by the internal root CA.
      # The entrypoint adds them to the trust store before dropping root.
      - ${HOST_CA_DIR:-/usr/local/share/ca-certificates}:/usr/local/share/ca-certificates/host:ro
    env_file:
      - path: environment/.env
        required: true
      - path: environment/.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      FIREWALL_RUN_AS: "${DEV_UID:-1000}:${DEV_GID:-1000}"
      # Anonymous reads of the repo; issue writes only with the GITEA_ISSUE_TOKEN `make claude` passes.
      FIREWALL_ALLOW: git.example.org:443
      # Local time for the status line's reset times and git dates (PHP keeps its own date.timezone).
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18.4}&charset=${POSTGRES_CHARSET:-utf8}
      # Commits from the container carry the host user's identity; the Makefile passes it from
      # the host's git config (the container has no ~/.gitconfig and .git/config is read-only).
      GIT_AUTHOR_NAME: ${GIT_USER_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_USER_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_USER_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_USER_EMAIL:-}
    depends_on:
      database:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  claude_config:
  dev_log:
