# CrowdSec scenario: brute-force / credential stuffing against OdinShield /login
#
# Volumetric detection — counts POST /login per source IP. Cannot distinguish
# successful from failed attempts (Symfony's form_login returns 302 in both
# cases and Location is not in the access log), but no legitimate user posts
# to /login more than a few times per minute.
#
# Prerequisites (all must be done before this scenario is useful):
#   1. compose.deploy.yaml — CADDY_GLOBAL_OPTIONS sets trusted_proxies +
#      client_ip_headers X-Forwarded-For (otherwise this bans Traefik).
#      Verify with a fresh request: `client_ip` in access.log must be the
#      external client IP, not 172.x.x.x.
#   2. compose.deploy.yaml — CADDY_SERVER_LOG_OPTIONS + CADDY_LOG_FORMAT_WRAP
#      + volume mount uncommented (otherwise no log file exists).
#   3. CrowdSec — crowdsecurity/caddy collection installed, acquisition
#      source for /var/log/odinshield/access.log with `labels: { type: caddy }`.
#
# Installation:
#   docker compose cp odinshield-login-bf.yaml \
#       crowdsec:/etc/crowdsec/scenarios/odinshield-login-bf.yaml
#   docker compose restart crowdsec
#   docker compose exec crowdsec cscli scenarios list | grep odinshield
#
# Verification (trigger 6 POSTs to /login within ~50 s from one IP):
#   docker compose exec crowdsec cscli alerts list -l 5
#   docker compose exec crowdsec cscli decisions list
#
# Calibration:
#   - capacity / leakspeed: 5 buckets, drains 1 every 10 s → bursts up to 5,
#     sustained > 6/min triggers. Raise to capacity: 10 if shared NAT egress
#     (corporate networks, carrier-grade NAT) causes false positives.
#   - blackhole: 5m → same source won't re-trigger for 5 minutes; the
#     Traefik bouncer's ban duration is set elsewhere (CrowdSec profile).
#
# Field-name note:
#   The crowdsecurity/caddy parser exposes the HTTP method as evt.Parsed.verb
#   and the path as evt.Parsed.request. If a future parser revision renames
#   these, run `cscli explain --file /var/log/odinshield/access.log --type caddy`
#   on a POST /login line and adjust the filter accordingly.

type: leaky
name: odinshield/login-bf
description: "Brute-force / credential stuffing against OdinShield /login"
filter: |
  evt.Meta.log_type == 'http_access-log' &&
  evt.Parsed.verb == 'POST' &&
  evt.Parsed.request == '/login'
leakspeed: 10s
capacity: 5
groupby: evt.Meta.source_ip
blackhole: 5m
labels:
  service: odinshield
  type: bruteforce
  remediation: true
