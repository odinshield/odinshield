# CrowdSec scenario: Symfony debug/dev endpoint probing
#
# These paths exist only in Symfony's dev environment and are NEVER routed
# in production. Any request for them is a scanner fingerprint — almost
# always a follow-up of a generic vulnerability sweep. Zero-tolerance ban.
#
# Endpoints matched (anchored at /):
#   /_profiler           — Web Profiler
#   /_wdt                — Web Debug Toolbar
#   /app_dev.php         — legacy dev front controller (Symfony 3.x era)
#   /app_test.php        — legacy test front controller
#   /index_dev.php       — alternative dev front controller name
#
# `type: trigger` (not leaky): a single matching request fires an alert
# immediately, no bucket accumulation needed.

type: trigger
name: odinshield/symfony-debug-probing
description: "Probing for Symfony dev/debug endpoints — never legitimate in production"
filter: |
  evt.Meta.log_type == 'http_access-log' &&
  evt.Parsed.request matches `^/(_profiler|_wdt|app_dev\.php|app_test\.php|index_dev\.php)`
groupby: evt.Meta.source_ip
blackhole: 1h
labels:
  service: odinshield
  type: scan
  remediation: true