framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: 'doctrine://default?auto_setup=0'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # The CSAF import is long-running (network fetches across every provider feed) and
            # must not block the console command that triggers it — route it to the worker.
            App\Message\RunCsafImportMessage: async

            # Same reasoning as the CSAF import above: two HTTP sources (FIRST EPSS, CISA KEV)
            # and a pass over every open CVE row — routed to the worker.
            App\Message\RunExploitationEnrichmentMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
