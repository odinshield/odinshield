# Password policy after the BSI recommendation "Sichere Passwörter erstellen" (read 2026-09-26):
# https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Cyber-Sicherheitsempfehlungen/Accountschutz/Sichere-Passwoerter-erstellen/sichere-passwoerter-erstellen_node.html
#
# The BSI names three equally good shapes; OdinShield accepts the first two (#239):
#   1. 8 to 12 characters using all four character types       -> min_length + require_*
#   2. 20 to 25 characters using two character types,           -> passphrase_min_*
#      e.g. several words ("5-6 random words separated by spaces")
#   3. 8 characters, three types, plus multi-factor login      -> not applicable, no MFA
#
# Character types: upper- and lower-case letters, digits, and special characters. "Special" means
# any printable ASCII punctuation or the space (the BSI lists the space explicitly). Non-ASCII
# symbols are allowed but count for no type; the BSI advises against umlauts and € because other
# keyboard layouts lack them. The rules live in App\Security\PasswordPolicy.
# Set passphrase_min_length to 0 to accept only the first shape.

parameters:
    app.password_policy:
        min_length: 8
        require_uppercase: true
        require_lowercase: true
        require_digit: true
        require_special: true
        passphrase_min_length: 20
        passphrase_min_classes: 2
