dh_auditor:
    enabled: true
    timezone: 'Europe/Berlin'
    providers:
        doctrine:
            viewer: false
            table_suffix: '_audit'
            ignored_columns:
                - id
                - uuid
                - createdAt
                - updatedAt
                - createdBy
                - updatedBy
                - lockVersion
                - csafSources
                - csaf_sources
                - cveIds
                - cve_ids
                - epssScore
                - epss_score
